<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Primary meta ───────────────────────────────────────── -->
    <title>TableKey — QR Restaurant Ordering</title>
    <meta name="description" content="TableKey lets restaurant guests scan a QR code, browse the menu, and order straight to their table. No app, no account required. Real-time kitchen display, waiter panel and owner analytics included." />
    <meta name="keywords" content="restaurant ordering, QR code menu, table ordering, digital menu, kitchen display, restaurant POS" />
    <meta name="author" content="TableKey" />
    <meta name="theme-color" content="#e05c27" />
    <meta name="robots" content="index, follow" />

    <!-- ── Favicon ────────────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ──────────── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TableKey" />
    <meta property="og:title" content="TableKey — Scan. Order. Enjoy." />
    <meta property="og:description" content="QR-code restaurant ordering. Guests scan, browse and order. Waiters manage tables. Kitchen sees live orders. No app needed." />
    <meta property="og:image" content="https://table-key.vercel.app/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TableKey — QR Restaurant Ordering Platform" />
    <meta property="og:url" content="https://table-key.vercel.app" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ───────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TableKey — Scan. Order. Enjoy." />
    <meta name="twitter:description" content="QR-code restaurant ordering. Guests scan, browse and order. Waiters manage tables. Kitchen sees live orders. No app needed." />
    <meta name="twitter:image" content="https://table-key.vercel.app/og-image.svg" />
    <meta name="twitter:image:alt" content="TableKey — QR Restaurant Ordering Platform" />

    <!-- ── PWA / mobile ───────────────────────────────────────── -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TableKey" />
    <meta name="application-name" content="TableKey" />

    <!-- ── Fonts ──────────────────────────────────────────────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
