  <path d="M240 20 C254 26 264 32 270 36"
    stroke="#5A7A42" stroke-opacity=".22" stroke-width="1.2"
    stroke-linecap="round" fill="none"/>

  <!-- L2 — fans left mid -->
  <path d="M246 54 C228 42 210 48 212 66 C226 72 244 68 246 54Z"
    fill="#7A9E5A" fill-opacity=".36"/>
  <path d="M246 54 C230 58 220 62 212 66"
    stroke="#5A7A42" stroke-opacity=".20" stroke-width="1.2"
