  <!-- L3 — fans right lower-mid -->
  <path d="M252 80 C266 66 282 70 280 88 C266 96 252 90 252 80Z"
    fill="#7A9E5A" fill-opacity=".32"/>
  <path d="M252 80 C264 84 274 88 280 88"
    stroke="#5A7A42" stroke-opacity=".18" stroke-width="1"
    stroke-linecap="round" fill="none"/>

  <!-- L4 — fans left, lower — fills gap below B1 L4 -->
  <path d="M248 116 C232 104 214 108 216 126 C230 132 246 128 248 116Z"
    fill="#7A9E5A" fill-opacity=".26"/>
  <path d="M248 116 C234 120 224 124 216 126"
    stroke="#5A7A42" stroke-opacity=".15" stroke-width="1"
    stroke-linecap="round" fill="none"/>


  <!-- ═══════════════════════════════════════════════
       BRANCH 3 — fills remaining lower gap, thin drooping stem
       ═══════════════════════════════════════════════ -->
  <path d="M228 2 C224 28 224 56 228 84 C230 102 228 124 222 144"
    stroke="#6B8C52" stroke-opacity=".30" stroke-width="1.3"
    stroke-linecap="round" fill="none"/>

  <!-- L1 — fans left upper, between B1 L2 and B2 L1 -->
  <path d="M226 22 C208 10 190 18 192 36 C206 42 224 38 226 22Z"
    fill="#7A9E5A" fill-opacity=".32"/>
  <path d="M226 22 C210 28 200 34 192 36"
    stroke="#5A7A42" stroke-opacity=".18" stroke-width="1"
    stroke-linecap="round" fill="none"/>

  <!-- L2 — fans right mid, sits between B2 L2 and B2 L3 -->
  <path d="M228 66 C242 54 258 58 256 74 C244 82 228 78 228 66Z"
    fill="#7A9E5A" fill-opacity=".26"/>
  <path d="M228 66 C240 70 250 74 256 74"
    stroke="#5A7A42" stroke-opacity=".15" stroke-width="1"
    stroke-linecap="round" fill="none"/>

  <!-- L3 — fans left lower, sits between B1 L5 and B2 L4 -->
  <path d="M224 108 C208 96 192 100 192 116 C206 122 222 118 224 108Z"
    fill="#7A9E5A" fill-opacity=".22"/>
  <path d="M224 108 C210 112 200 116 192 116"
    stroke="#5A7A42" stroke-opacity=".13" stroke-width="1"
    stroke-linecap="round" fill="none"/>

  <!-- L4 — small trailing bottom -->
  <path d="M222 140 C208 130 194 134 194 148 C206 154 220 152 222 140Z"
    fill="#7A9E5A" fill-opacity=".17"/>
  <path d="M222 140 C210 144 202 148 194 148"
    stroke="#5A7A42" stroke-opacity=".11" stroke-width="1"
    stroke-linecap="round" fill="none"/>

</svg>
