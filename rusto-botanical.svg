    stroke-linecap="round" fill="none"/>


  <!-- ═══════════════════════════════════════════════
       BRANCH 2 — fans right from same root, stays inboard of edge
       ═══════════════════════════════════════════════ -->
  <path d="M238 6 C244 30 248 56 252 82 C254 100 252 120 246 140"
    stroke="#6B8C52" stroke-opacity=".40" stroke-width="1.5"
    stroke-linecap="round" fill="none"/>

  <!-- L1 — fans right, upper -->
  <path d="M240 20 C256 8 272 16 270 36 C254 42 238 36 240 20Z"
